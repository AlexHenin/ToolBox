[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-local"
version = "0.1.0"
description = "Local file tools for a Mac app, command line, and MCP clients"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "Pillow>=11", "PyMuPDF>=1.26"]

[project.scripts]
toolbox = "toolbox.cli:main"
toolbox-mcp = "toolbox.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*"]
