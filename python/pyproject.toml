[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-local"
version = "0.1.0"
description = "Local tools for the Toolbox Mac app and command line"
requires-python = ">=3.11"
dependencies = ["Pillow>=11", "PyMuPDF>=1.26"]

[project.scripts]
toolbox = "toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*"]
